<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 14px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #075E54; }
    label { display: block; font-size: 12px; margin: 8px 0 3px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 5px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .row label { margin: 0; font-size: 13px; }
    button { margin-top: 12px; width: 100%; padding: 8px; font-size: 13px; border: 0; border-radius: 6px; background: #25D366; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #eee; color: #333; }
    #status { margin-top: 10px; font-size: 12px; padding: 6px; border-radius: 5px; background: #f4f4f4; white-space: pre-wrap; }
    .switch { transform: scale(1.3); }
  </style>
</head>
<body>
  <h1>Vanessa — Atendente IA</h1>

  <label for="agentUrl">URL do agente (túnel/Easypanel)</label>
  <input id="agentUrl" placeholder="https://xxxx.trycloudflare.com" />

  <label for="token">Webhook token</label>
  <input id="token" type="password" placeholder="segredo do .env" />

  <div class="row">
    <input type="checkbox" id="enabled" class="switch" />
    <label for="enabled">Responder automaticamente</label>
  </div>

  <button id="save">Salvar</button>
  <button id="test" class="secondary">Testar conexão</button>

  <div id="status">Desativada.</div>

  <script src="popup.js"></script>
</body>
</html>
